<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zepto Support Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10B981; /* Zepto-inspired green */
            --primary-hover: #059669;
            --bg-color: #F9FAFB;
            --card-bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
            --user-msg: #10B981;
            --user-msg-text: #FFFFFF;
            --bot-msg: #F3F4F6;
            --bot-msg-text: #1F2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            height: 100%;
        }

        /* HEADER */
        .header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            z-index: 10;
        }

        .header-info h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .header-info p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
            gap: 1rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
            animation: pulse 2s infinite;
        }

        .clear-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background: #F3F4F6;
            color: var(--text-main);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* CHAT AREA */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scroll-behavior: smooth;
        }

        /* WELCOME SCREEN */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
            animation: fadeIn 0.5s ease-in-out;
        }

        .welcome-screen h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .welcome-screen p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            max-width: 400px;
        }

        .examples-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            width: 100%;
            max-width: 600px;
        }

        .example-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            font-size: 0.875rem;
            color: var(--text-main);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .example-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.1);
            transform: translateY(-2px);
        }

        /* MESSAGES */
        .message-row {
            display: flex;
            width: 100%;
            animation: slideUp 0.3s ease-out;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.bot {
            justify-content: flex-start;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.875rem;
            flex-shrink: 0;
            margin: 0 1rem;
        }

        .user .message-avatar {
            background: var(--primary);
            color: white;
            order: 2;
            margin-left: 1rem;
            margin-right: 0;
        }

        .bot .message-avatar {
            background: #E5E7EB;
            color: var(--text-muted);
            order: 1;
            margin-right: 1rem;
            margin-left: 0;
        }

        .message-content {
            max-width: 75%;
            order: 1;
        }

        .user .message-content {
            order: 1;
        }
        
        .bot .message-content {
            order: 2;
        }

        .message-bubble {
            padding: 1rem 1.25rem;
            border-radius: 16px;
            font-size: 0.9375rem;
            line-height: 1.5;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            white-space: pre-wrap;
        }

        .user .message-bubble {
            background: var(--user-msg);
            color: var(--user-msg-text);
            border-bottom-right-radius: 4px;
        }

        .bot .message-bubble {
            background: var(--bot-msg);
            color: var(--bot-msg-text);
            border-bottom-left-radius: 4px;
        }

        /* BOT METADATA */
        .meta-container {
            margin-top: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            animation: fadeIn 0.3s ease-in;
        }

        .rag-badge {
            display: inline-flex;
            align-items: center;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            letter-spacing: 0.025em;
        }

        .rag-badge.policy {
            background: #ECFDF5;
            color: #047857;
            border: 1px solid #A7F3D0;
        }

        .rag-badge.general {
            background: #F3F4F6;
            color: #4B5563;
            border: 1px solid #E5E7EB;
        }

        .meta-sources {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        
        .meta-sources strong {
            display: block;
            margin-bottom: 0.25rem;
            color: var(--text-main);
        }

        .source-tag {
            display: inline-block;
            background: white;
            border: 1px solid var(--border);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            margin-right: 0.3rem;
            margin-bottom: 0.3rem;
            font-size: 0.75rem;
        }

        /* LOADING */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.5rem 1rem;
            background: var(--bot-msg);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            width: fit-content;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* INPUT AREA */
        .input-area {
            padding: 1.5rem 2rem;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        textarea {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.875rem 1rem;
            font-family: inherit;
            font-size: 0.9375rem;
            color: var(--text-main);
            resize: none;
            outline: none;
            min-height: 50px;
            max-height: 150px;
            overflow-y: auto;
            transition: border-color 0.2s, box-shadow 0.2s;
            line-height: 1.4;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 1.25rem;
            height: 50px;
            font-weight: 500;
            font-size: 0.9375rem;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background: var(--primary-hover);
        }

        .send-btn:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* RESPONSIVE */
        @media (max-width: 640px) {
            .header {
                padding: 1rem;
            }
            .chat-container {
                padding: 1rem;
            }
            .input-area {
                padding: 1rem;
            }
            .message-avatar {
                margin: 0 0.5rem;
            }
            .user .message-avatar { margin-left: 0.5rem; }
            .bot .message-avatar { margin-right: 0.5rem; }
            .message-content { max-width: 85%; }
            .status-indicator span { display: none; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="header-info">
                <h1>Zepto Support Assistant</h1>
                <p>AI-powered customer support for Zepto policies</p>
            </div>
            <div class="status-indicator">
                <button class="clear-btn" id="clearBtn" onclick="clearChat()" style="display: none;">Clear chat</button>
                <div><span class="status-dot"></span><span>AI Assistant Online</span></div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-container" id="chatBox">
            <!-- Welcome Screen -->
            <div class="welcome-screen" id="welcomeScreen">
                <h2>How can we help you?</h2>
                <p>Ask questions about delivery, payments, refunds, cancellations, orders, and other Zepto policies.</p>
                <div class="examples-grid">
                    <button class="example-card" onclick="setQuery('What is the delivery fee?')">What is the delivery fee?</button>
                    <button class="example-card" onclick="setQuery('What is the refund policy?')">What is the refund policy?</button>
                    <button class="example-card" onclick="setQuery('How can I cancel my order?')">How can I cancel my order?</button>
                    <button class="example-card" onclick="setQuery('What payment methods are supported?')">What payment methods are supported?</button>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="Ask a question about Zepto policies..." rows="1" oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>
            </div>
            <button id="sendBtn" class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const clearBtn = document.getElementById('clearBtn');
        let isProcessing = false;

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight) + 'px';
            if(textarea.value.trim() === '') {
                textarea.style.height = '50px';
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function setQuery(text) {
            userInput.value = text;
            autoResize(userInput);
            sendMessage();
        }

        function clearChat() {
            chatBox.innerHTML = '';
            chatBox.appendChild(welcomeScreen);
            welcomeScreen.style.display = 'flex';
            clearBtn.style.display = 'none';
        }

        async function sendMessage() {
            const query = userInput.value.trim();
            if (!query || isProcessing) return;

            // Hide welcome screen
            welcomeScreen.style.display = 'none';
            clearBtn.style.display = 'inline-block';

            // Add user message
            addMessage(query, 'user');
            
            // Clear input
            userInput.value = '';
            autoResize(userInput);
            
            // Disable input while processing
            isProcessing = true;
            userInput.disabled = true;
            sendBtn.disabled = true;

            // Add loading indicator
            const loadingId = addLoading();

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                removeElement(loadingId);

                if (!response.ok) {
                    throw new Error('API Error');
                }

                const data = await response.json();
                addMessage(data.answer, 'bot', data.sources, data.confidence);
                
            } catch (error) {
                removeElement(loadingId);
                addMessage("Sorry, I couldn't process your request. Please try again.", 'bot', null, null, true);
            } finally {
                isProcessing = false;
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function addMessage(text, sender, sources = null, confidence = null, isError = false) {
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = sender === 'user' ? 'U' : 'AI';

            const content = document.createElement('div');
            content.className = 'message-content';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            if (isError) bubble.style.color = '#EF4444'; // Red text for error
            bubble.textContent = text;
            content.appendChild(bubble);

            // Add metadata for bot responses
            if (sender === 'bot' && !isError) {
                const meta = document.createElement('div');
                meta.className = 'meta-container';
                
                // RAG Indicator
                const isRag = sources && sources.length > 0;
                const badge = document.createElement('span');
                badge.className = `rag-badge ${isRag ? 'policy' : 'general'}`;
                badge.textContent = isRag ? 'Policy sources retrieved' : 'General response';
                meta.appendChild(badge);

                // Sources
                if (isRag) {
                    const srcDiv = document.createElement('div');
                    srcDiv.className = 'meta-sources';
                    const srcTitle = document.createElement('strong');
                    srcTitle.textContent = 'Sources:';
                    srcDiv.appendChild(srcTitle);
                    
                    sources.forEach(src => {
                        const tag = document.createElement('span');
                        tag.className = 'source-tag';
                        tag.textContent = src;
                        srcDiv.appendChild(tag);
                    });
                    
                    if (confidence !== null) {
                        const confTag = document.createElement('span');
                        confTag.style.display = 'block';
                        confTag.style.marginTop = '0.25rem';
                        confTag.textContent = `Confidence: ${(confidence * 100).toFixed(0)}%`;
                        srcDiv.appendChild(confTag);
                    }
                    meta.appendChild(srcDiv);
                }
                
                content.appendChild(meta);
            }

            row.appendChild(avatar);
            row.appendChild(content);
            chatBox.appendChild(row);
            scrollToBottom();
        }

        function addLoading() {
            const id = 'loading-' + Date.now();
            const row = document.createElement('div');
            row.className = 'message-row bot';
            row.id = id;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = 'AI';

            const content = document.createElement('div');
            content.className = 'message-content';

            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.innerHTML = `
                Assistant is thinking
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            `;
            
            content.appendChild(indicator);
            row.appendChild(avatar);
            row.appendChild(content);
            chatBox.appendChild(row);
            scrollToBottom();
            
            return id;
        }

        function removeElement(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
